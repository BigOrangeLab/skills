name: WordPress 7.2 RC1 skill refresh reminder

# One-off reminder: on WordPress 7.2 RC1 day (17 November 2026), open an issue
# to re-verify the wp-7-2-upgrade skill against RC1. Cron has no year field, so
# the job checks the date and only acts in 2026. Delete this file after it fires.

on:
    schedule:
        - cron: "0 14 17 11 *" # 17 November, 14:00 UTC (09:00 America/New_York)
    workflow_dispatch: # Manual run opens the issue regardless of date

permissions:
    issues: write

jobs:
    remind:
        runs-on: ubuntu-latest
        steps:
            - name: Open the RC1 refresh issue
              uses: actions/github-script@v7
              with:
                  script: |
                      if (context.eventName === 'schedule' && new Date().getUTCFullYear() !== 2026) {
                        core.info('Not 2026; this one-off reminder has already served its purpose.');
                        return;
                      }

                      const title = 'Refresh wp-7-2-upgrade against WordPress 7.2 RC1';
                      const { data: existing } = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'all',
                        per_page: 100,
                      });
                      if (existing.some((issue) => issue.title === title)) {
                        core.info('Reminder issue already exists; nothing to do.');
                        return;
                      }

                      const body = [
                        '@georgestephanis WordPress 7.2 RC1 is due today (17 November 2026). The `wp-7-2-upgrade` skill was verified against **7.2 Beta 1** (`7.2-beta1-64606`, Gutenberg 24.2.0) and needs a refresh now that the code and string freeze is in effect.',
                        '',
                        '## Checklist',
                        '',
                        '- [ ] Re-check every **In Beta 1** item in `skills/wp-7-2-upgrade/references/breaking-changes.md` against RC1, especially whether `wp_kses()` still uses the HTML API parser by default.',
                        '- [ ] Re-check the **Roadmap items not in Beta 1** table in `references/sources.md`: anything that landed, anything punted to 7.3.',
                        '- [ ] Review 7.2 dev notes published since 22 October (https://make.wordpress.org/core/tag/dev-notes-7-2/) and the 7.2 Field Guide if it is out.',
                        '- [ ] Note the final Gutenberg version merged into 7.2 and update `metadata.written_against` (`wordpress`, `gutenberg`) and `metadata.written`.',
                        '- [ ] Re-run `scripts/audit-wp-72.sh` and add checks for any new breaking changes.',
                        '- [ ] Update the README row and run `npm run lint`.',
                        '- [ ] Delete `.github/workflows/wp-7-2-rc1-reminder.yml`.',
                        '',
                        'Final release is scheduled for 8 December 2026; plan a last pass then.',
                      ].join('\n');

                      const { data: issue } = await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title,
                        body,
                        assignees: ['georgestephanis'],
                      });
                      core.info(`Opened ${issue.html_url}`);
